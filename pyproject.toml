[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "pactree"
version = "0.1.0"
description = "Deterministic context trees for AI agents and applications."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Earl Dennison Tan" }]
keywords = ["context", "tree", "agent", "pact", "pactree"]
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/earldennison/pactree-py"
Documentation = "https://github.com/earldennison/pactree-py/blob/main/docs/api-contract.md"

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9",
]

[tool.maturin]
bindings = "pyo3"
module-name = "pactree.pactree_engine"
python-source = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
