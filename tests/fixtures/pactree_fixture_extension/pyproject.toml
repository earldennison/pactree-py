[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pactree-fixture-extension"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = []

[project.entry-points."pactree.extensions"]
fixture = "pactree_fixture_extension:extension"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
